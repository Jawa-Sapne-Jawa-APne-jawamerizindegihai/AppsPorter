name: Generate Port
run-name: ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: "Download link"
        required: true
      patch:
        description: "Patch"
        required: true
      run_id:
        description: "Correlation id sent by the website"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source APK
        run: curl -L --fail "${{ inputs.apk_link }}" -o input.apk

      - name: Run port
        run: bash build_port.sh input.apk "${{ inputs.patch }}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_id }}
          path: out/*.apk

          retention-days: 1
